<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>云术生存战争服务器官网</title>
    <meta
      name="description"
      content="云术生存战争服务器官方网站：服务器介绍、特色玩法、管理组、玩家作品、官方公告与加入方式。"
    />
    <meta name="theme-color" content="#3d60f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131315" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="./img/logo-mark.jpg" />
    <script>
      // 在首帧之前套上主题，避免暗色用户先看到一闪而白的页面
      ;(function () {
        try {
          var saved = localStorage.getItem('scweb-theme')
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
